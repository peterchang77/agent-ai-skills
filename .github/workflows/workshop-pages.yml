name: Publish workshop site

on:
  push:
    branches: [main]
    paths:
      - "agent-workshop/**"
      - ".github/workflows/workshop-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-workshop
    env:
      SITE_URL: https://peterchang77.github.io/agent-ai-skills/
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Validate content and generate docs
        run: uv run scripts/build.py
      - name: Build site (strict)
        run: uvx --with "mkdocs<2" --with mkdocs-material==9.7.7 mkdocs build --strict -d site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: agent-workshop/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
