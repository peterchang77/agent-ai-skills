schema: 1
id: coding-agent-basics
title: Directing Coding Agents: From Request to Reliable Result
audience:
  - data scientists
  - office professionals
  - non-developer knowledge workers
format:
  canonical_content: markdown
  browser_entrypoint: README.md
  interactive_overlay: SKILL.md
  facilitator_skill: tutorial-facilitator
delivery:
  mode: navigation-led-guided-build
  learner_role: decision-maker-and-reviewer
  agent_roles:
    - coach
    - operator
  interaction_loop:
    - orient
    - capable-request
    - plan-and-options
    - scope-check
    - execute-and-review
mission:
  title: Reliable report from a capable request
  outcome: Direct an agent from a broad reporting request to a reviewable, source-preserving draft while choosing meaningful trade-offs and avoiding unnecessary workflow debt.
  safe_project: examples/sample-project
  modules:
    - Understand the agent, tools, and files
    - Give one capable request and inspect a plan
    - Choose options and appropriate tools
    - Assess scale, friction, and a staged route
    - Review evidence, steer revision, and retain only useful reuse
state:
  directory: .tutorial
  templates:
    learner_profile: templates/learner-profile.md
    progress: templates/progress.md
    mission_log: templates/mission-log.md
    handoff: templates/handoff.md
routes:
  - foundation
  - practitioner
  - technical-transfer
  - goal-first
required_outcomes:
  - describe-a-useful-outcome-and-boundary
  - inspect-an-agent-plan-and-tool-rationale
  - request-options-and-a-recommendation
  - assess-scope-before-large-or-uncertain-work
  - inspect-evidence-and-steer-a-revision
  - decide-whether-reuse-is-justified
modules:
  - modules/00-mental-model.md
  - modules/01-capable-request.md
  - modules/02-options-and-tools.md
  - modules/03-scope-and-friction.md
  - modules/04-review-revise-reuse.md
