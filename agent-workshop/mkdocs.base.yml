site_name: Working with Coding Agents
site_url: !ENV [SITE_URL, ""]
site_description: Practical, hands-on material on working with coding agents for researchers.
docs_dir: docs
theme:
  name: material
  logo: images/logo.svg
  favicon: images/favicon.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Switch to light mode}
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.tabs
    - navigation.footer
    - navigation.top
    - navigation.path
    - toc.follow
    - search.highlight
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html
  - toc: {permalink: false}
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
